---
dependency:
  name: galaxy
driver:
  name: docker
lint: |
    yamllint .
    ansible-lint
    flake8
platforms:
  - name: rockylinux-9-python314
    image: rockylinux:9
    groups:
      - py3
  - name: ubuntu-2204-python314
    image: ubuntu:22.04
    groups:
      - py3

provisioner:
  name: ansible
  playbooks:
    converge: ../resources/playbook.yml
  lint:
    name: ansible-lint
  inventory:
    group_vars:
      py3:
        ansible_python_interpreter:  /usr/bin/python3
        python_version: "3.14"

scenario:
  name: python314
verifier:
  name: testinfra

