---

- name: install software-properties-common
  ansible.builtin.apt:
    name: software-properties-common
    state: present
    update_cache: yes
    # update only if the last update is older than one day
    cache_valid_time: 86400

- name: Add deadsnakes PPA
  ansible.builtin.apt_repository:
    repo: ppa:deadsnakes/ppa
    state: present

- name: apt cache update
  ansible.builtin.apt:
      update_cache: yes

- name: python venv | install python
  become: true
  ansible.builtin.apt:
    update_cache: true
    name:
      - "python{{ python_version }}"
      - "python{{ python_version }}-venv"
      - wget
    state: present

- name: get get-pip
  ansible.builtin.shell: "wget https://bootstrap.pypa.io/get-pip.py"
  changed_when: false

- name: Install pip for Python  using get-pip
  ansible.builtin.shell:  "python{{ python_version }} get-pip.py"
  changed_when: false


