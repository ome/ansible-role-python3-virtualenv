---


- name: python venv | install epel-release
  become: true
  ansible.builtin.dnf:
    name:
      epel-release
    update_cache: true
    state: present


- name: python venv | install packages
  become: true
  ansible.builtin.dnf:    
    name:
      - "python{{ python_version }}-devel.x86_64"
      - "python{{ python_version }}"
      - "python{{ python_version }}-pip"
      ##- "python{{ python_version }}-setuptools"
    state: present


